# 部署到 GitHub Pages（Astro 静态站，零后端）
#
# 默认按「项目页」部署：https://<owner>.github.io/<repo>/
# 如果你用的是自定义域名或 <user>.github.io 用户页，把下面 build 步骤的
# ASTRO_BASE 去掉（留空），并视情况把 ASTRO_SITE 改成你的域名。
#
# 启用方式（仓库 Settings → Pages → Build and deployment → Source 选 GitHub Actions）

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新推送取消进行中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # 项目页：自动取仓库名作为子路径，如 /slow-variable/。
    # 放在 job 级，build 和 audit 两步都要用到（audit 要剥掉 base 才能对上磁盘文件）。
    env:
      ASTRO_SITE: https://${{ github.repository_owner }}.github.io
      ASTRO_BASE: /${{ github.event.repository.name }}/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Audit links
        run: python3 audit-links.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
