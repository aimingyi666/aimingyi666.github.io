# 部署到 GitHub Pages（Astro 静态站，零后端）
#
# push 到 main 就自动构建并发布，不用本地手动传文件。
#
# 两种 Pages 形态自动适配（靠仓库名判断）：
#   - 用户页仓库（名形如 <user>.github.io）：站点在根域名，base 留空
#   - 项目页仓库（其他名字）：站点在 /<repo>/ 子路径，base 自动设为 /<repo>/
# 页面代码、资源、RSS、搜索全部 base 感知，无需手动改链接。
#
# 启用方式（仓库 Settings → Pages → Build and deployment → Source 选 GitHub Actions）

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新推送取消进行中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # 站点正式域名（canonical / RSS 绝对链接用）。base 由下面步骤按仓库名自动决定。
    env:
      ASTRO_SITE: https://${{ github.repository_owner }}.github.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set base（用户页→空；项目页→/<repo>/）
        run: |
          repo="${{ github.event.repository.name }}"
          owner="${{ github.repository_owner }}"
          # 只有仓库名严格等于 <owner>.github.io 才是用户页（根路径）；
          # 否则（包括 Aaron-AiMingYi.github.io 这种挂在别人名下的）都是项目页，带 /<repo>/ 前缀。
          if [[ "$repo" == "${owner}.github.io" ]]; then
            echo "ASTRO_BASE=" >> "$GITHUB_ENV"
          else
            echo "ASTRO_BASE=/$repo/" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Audit links
        run: python3 audit-links.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
